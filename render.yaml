services:
  - type: web
    name: loqol-tds
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: loqol-tds-db
          property: connectionString
      # Set these in the dashboard; the app runs without them and says so.
      - key: OPENAI_API_KEY
        sync: false
      - key: DOCUSEAL_API_KEY
        sync: false
      - key: DOCUSEAL_TEMPLATE_ID
        sync: false

databases:
  - name: loqol-tds-db
    plan: basic-256mb
    databaseName: loqol
    user: loqol

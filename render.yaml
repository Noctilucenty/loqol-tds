services:
  - type: web
    name: loqol-tds
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: loqol-tds-db
          property: connectionString
      # Set in the dashboard, not here.
      - key: OPENAI_API_KEY
        sync: false
      - key: DOCUSEAL_API_KEY
        sync: false
      - key: DOCUSEAL_TEMPLATE_ID
        sync: false

databases:
  - name: loqol-tds-db
    plan: free
    databaseName: loqol
    user: loqol
